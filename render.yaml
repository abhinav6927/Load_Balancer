services:
  - type: web
    name: load-balancer-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn gui_backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FRONTEND_ORIGIN
        value: https://abhinav6927.github.io
      - key: CONTROL_TOKEN
        sync: false
