<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Balancer Control Panel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Load Balancer Control Panel</h1>
            <div class="status-indicator">
                <span id="connection-status" class="status-dot offline"></span>
                <span id="connection-text">Connecting...</span>
            </div>
        </header>

        <div class="main-content">
            <section class="control-panel">
                <h2>Control Panel</h2>
                
                <div class="control-group">
                    <h3>Backend Servers</h3>
                    <div class="button-row">
                        <button id="start-servers" class="btn btn-success">Start All Servers</button>
                        <button id="stop-servers" class="btn btn-danger">Stop All Servers</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Load Balancer</h3>
                    <div class="button-row">
                        <button id="start-lb" class="btn btn-success">Start Load Balancer</button>
                        <button id="stop-lb" class="btn btn-danger">Stop Load Balancer</button>
                    </div>
                    <div class="form-group">
                        <label for="algorithm-select">Algorithm:</label>
                        <select id="algorithm-select">
                            <option value="round_robin">Round Robin</option>
                            <option value="least_connections">Least Connections</option>
                            <option value="ip_hash">IP Hash</option>
                        </select>
                        <button id="set-algorithm" class="btn btn-primary">Apply</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Load Testing</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="requests">Requests:</label>
                            <input type="number" id="requests" value="1000" min="1" max="100000">
                        </div>
                        <div class="form-group">
                            <label for="concurrency">Concurrency:</label>
                            <input type="number" id="concurrency" value="50" min="1" max="1000">
                        </div>
                        <div class="form-group">
                            <label for="rps">RPS:</label>
                            <input type="number" id="rps" value="100" min="1" max="10000">
                        </div>
                    </div>
                    <button id="start-load-test" class="btn btn-warning">Run Load Test</button>
                </div>

                <div class="control-group">
                    <h3>Port Management</h3>
                    <div class="form-row">
                        <input type="number" id="port-input" placeholder="Port number" min="1" max="65535">
                        <button id="check-port" class="btn btn-info">Check Port</button>
                        <button id="kill-port" class="btn btn-danger">Kill Process</button>
                    </div>
                    <div id="port-info" class="info-box"></div>
                </div>
            </section>

            <section class="metrics-dashboard">
                <h2>Real-time Metrics</h2>
                
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">Total Requests</div>
                        <div id="total-requests" class="metric-value">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Request Rate</div>
                        <div id="request-rate" class="metric-value">0.0 RPS</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Active Connections</div>
                        <div id="active-connections" class="metric-value">0</div>
                    </div>
                </div>

                <div class="server-status">
                    <h3>Server Status</h3>
                    <div id="server-list" class="server-grid"></div>
                </div>
            </section>

            <section class="graph-panel">
                <h2>Request Distribution</h2>
                <div class="graph-controls">
                    <button id="pause-graph" class="btn btn-secondary">Pause</button>
                    <button id="clear-graph" class="btn btn-secondary">Clear</button>
                </div>
                <div id="request-graph"></div>
            </section>

            <section class="logs-panel">
                <h2>System Logs</h2>
                <div class="log-controls">
                    <button id="clear-logs" class="btn btn-secondary">Clear Logs</button>
                    <button id="auto-scroll" class="btn btn-secondary active">Auto Scroll</button>
                </div>
                <div id="log-container" class="log-container">
                    <div id="log-content"></div>
                </div>
            </section>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Confirm Action</h3>
            <p id="modal-message"></p>
            <div class="modal-buttons">
                <button id="modal-confirm" class="btn btn-danger">Confirm</button>
                <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
